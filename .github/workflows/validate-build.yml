
name: Validate and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify essential output
        run: |
          test -s dist/index.html
          test -s dist/about/index.html
          test -s dist/privacy/index.html

          if grep -R -nE 'ca-pub-[0-9]+|pagead2\.googlesyndication\.com' dist; then
            echo "Unexpected ad code found."
            exit 1
          fi
  
